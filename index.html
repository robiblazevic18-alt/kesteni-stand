<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a3b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Štand">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Štand – kesteni, kukuruz, kokice i igračke</title>
<style>
:root{--bg:#f7f2ea;--card:#fffdf9;--ink:#2b1d14;--muted:#7a6656;--line:#e6dccf;--brand:#8a3b12;--brand2:#b5541c;--ok:#2f7a3d;--bad:#b3261e;--warn:#a86b00;--chip:#f1e6d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0;position:sticky;top:0;z-index:5}
header .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
header h1{margin:0;font-size:18px;font-weight:650}
header .who{font-size:13px;opacity:.9;display:flex;gap:8px;align-items:center}
header .who button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:7px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;background:transparent;border:0;color:#f5dcc8;padding:10px 12px;font:inherit;font-size:15px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:#ffd29a;font-weight:600}
main{max-width:900px;margin:0 auto;padding:14px 12px calc(110px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:17px}
.card h3{margin:14px 0 8px;font-size:15px;color:var(--brand)}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>label{flex:1 1 140px}
label{display:block;font-size:13px;color:var(--muted)}
input,select{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid #cfc2b2;border-radius:8px;background:#fff;color:var(--ink);margin-top:3px}
input:focus,select:focus{outline:2px solid var(--brand2);border-color:transparent}
input.num{text-align:right;font-variant-numeric:tabular-nums}
.btn{font:inherit;border:0;border-radius:9px;padding:11px 16px;background:var(--brand);color:#fff;cursor:pointer;font-weight:600}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.bad{background:#fbe9e7;color:var(--bad)}
.btn.small{padding:7px 10px;font-size:14px;font-weight:500}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
td.r,th.r{text-align:right}
.cat{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;background:var(--chip);color:var(--brand);font-weight:600}
.big{font-size:30px;font-weight:750;font-variant-numeric:tabular-nums}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-variant-numeric:tabular-nums}
.sum .r{text-align:right}
.sum .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.result{background:#2b1d14;color:#fff;border-radius:12px;padding:16px;margin:12px 0}
.result .lbl{font-size:13px;opacity:.8}
.result .sum .tot{border-color:#5a4535}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:13px;font-weight:600}
.pill.ok{background:#e4f3e6;color:var(--ok)}.pill.bad{background:#fbe9e7;color:var(--bad)}.pill.warn{background:#fff3d6;color:var(--warn)}
.prod{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff}
.prod .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.prod .head b{font-size:15px}
.prod .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.prod .out{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:14px;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px;color:var(--ink)}
.check input{width:22px;height:22px;margin:0}
.empty{padding:20px;text-align:center;color:var(--muted)}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs2 button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer}
.tabs2 button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
details{border-bottom:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b1d14;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(30,20,10,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:14px;padding:18px;max-width:420px;width:100%}
.modal .box p{margin:0 0 14px}
.modal .act{display:flex;gap:8px;justify-content:flex-end}
.stickybar{position:fixed;left:0;right:0;bottom:0;background:#fffdf9;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:4}
.stickybar .v{font-size:20px;font-weight:750;font-variant-numeric:tabular-nums}
.login{max-width:380px;margin:40px auto}
.login .logo{text-align:center;margin-bottom:16px}
.login .logo img{width:84px;height:84px;border-radius:20px}
.offline{background:#fff3d6;color:var(--warn);text-align:center;font-size:13px;padding:6px;display:none}
.offline.show{display:block}
.install{background:#fff;border:1px dashed var(--brand2)}
</style>
</head>
<body>
<div class="offline" id="offline">Nema interneta – podaci se ne mogu spremiti dok se veza ne vrati.</div>
<div id="app"><div class="empty" style="margin-top:80px">Učitavam…</div></div>
<div class="modal" id="modal"><div class="box"><p id="mtext"></p><div class="act"><button class="btn sec" id="mno">Odustani</button><button class="btn" id="myes">U redu</button></div></div></div>
<div class="toast" id="toast"></div>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
